      <stop stop-color="#847042"/><stop offset=".28" stop-color="#e2c386"/><stop offset=".54" stop-color="#ba9a61"/><stop offset="1" stop-color="#725b36"/>
    </linearGradient>
    <linearGradient id="stand-wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d4aa6c"/><stop offset=".5" stop-color="#b88b4f"/><stop offset="1" stop-color="#896136"/>
