<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="stand-title stand-description">
  <title id="stand-title">Боковая винтовая подставка лодочной мастерской</title>
  <desc id="stand-description">Редактируемый вектор: оливковый металлический козелок, латунный винт, деревянная седловина с мягкой прокладкой. Контакт с килем 160,24; подошва 160,304. Верхний левый свет. Прозрачный фон.</desc>
