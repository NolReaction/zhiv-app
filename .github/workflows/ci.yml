name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check tracked files and reachable history
        run: |
          node scripts/check-secrets.mjs
          node scripts/check-secrets.mjs --history

  web_shards:
    name: Web checks (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Each isolated checkout builds both targets before its sequential test shard.
    # Keep the 60-minute ceiling for slow runners without dropping any tests.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run architecture:check

      - name: Check committed Tiled export
        run: npm run world:check

      - name: Check audio catalog and asset licenses
        run: npm run audio:check

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Build the VPS application
        run: npm run build:vps

      - name: Build Sites
        run: npm run build

      - name: Run web test shard
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 tests/*.test.mjs

  web:
    name: Web checks
    needs: web_shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every web shard
        shell: bash
        env:
          WEB_SHARDS_RESULT: ${{ needs.web_shards.result }}
        run: test "$WEB_SHARDS_RESULT" = success

  engine:
    name: Engine package and standalone editor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check the engine and editor independently
        run: npm run typecheck:engine

      - name: Build the library and standalone editor
        run: npm run build:engine

      - name: Check engine contracts and editor regressions
        run: npm run test:engine

  market-sales:
    name: Markets, trader, collections and costumes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run market, trader and collection regressions
        working-directory: apps/api
        run: |
          ./gradlew --no-daemon test \
            --tests ru.zhiv.db.JdbcMarketSaleClaimsIntegrationTest \
            --tests ru.zhiv.economy.EconomyMarketRulesTest \
            --tests ru.zhiv.db.JdbcLeaftailV12IntegrationTest \
            --tests ru.zhiv.db.JdbcCollectionV12IntegrationTest \
            --tests ru.zhiv.economy.EconomyLeaftailShopTest \
            --tests ru.zhiv.economy.EconomyLeaftailAssortmentTest \
            --tests ru.zhiv.economy.EconomyBookProgressionTest \
            --tests ru.zhiv.economy.EconomyFourthStageTest \
            --tests ru.zhiv.world.WorldRulesTest \
            --tests ru.zhiv.economy.EconomyWardrobeTest \
            --tests ru.zhiv.db.JdbcPremiumCostumesIntegrationTest

      - name: Require PostgreSQL and all focused suites
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('ru.zhiv.db.JdbcMarketSaleClaimsIntegrationTest', 'ru.zhiv.economy.EconomyMarketRulesTest', 'ru.zhiv.db.JdbcLeaftailV12IntegrationTest', 'ru.zhiv.db.JdbcCollectionV12IntegrationTest', 'ru.zhiv.economy.EconomyLeaftailShopTest', 'ru.zhiv.economy.EconomyLeaftailAssortmentTest', 'ru.zhiv.economy.EconomyBookProgressionTest', 'ru.zhiv.economy.EconomyFourthStageTest', 'ru.zhiv.world.WorldRulesTest', 'ru.zhiv.economy.EconomyWardrobeTest', 'ru.zhiv.db.JdbcPremiumCostumesIntegrationTest'):
              path = Path('apps/api/build/test-results/test') / f'TEST-{name}.xml'
              report = ET.parse(path).getroot()
              count = int(report.get('tests', '0'))
              assert report.get('name') == name and count > 0, f'{name}: missing or empty suite'
              assert all(int(report.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), f'{name}: suite failed or PostgreSQL was skipped'
              cases = report.findall('testcase')
              assert len(cases) == count, f'{name}: incomplete test cases'
              assert not any(child.tag in ('failure', 'error', 'skipped') for case in cases for child in case), f'{name}: failed or skipped test cases'
              print(f'{name}: {count} passed, 0 skipped, 0 failures, 0 errors.')
          PY

      - name: Upload market sale test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-sales-test-reports-${{ github.run_attempt }}
          path: |
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcMarketSaleClaimsIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyMarketRulesTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcLeaftailV12IntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcCollectionV12IntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyLeaftailShopTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyLeaftailAssortmentTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyBookProgressionTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyFourthStageTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.world.WorldRulesTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.economy.EconomyWardrobeTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcPremiumCostumesIntegrationTest.xml
          retention-days: 7
          if-no-files-found: error

  one-time-rewards:
    name: One-time gifts and migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run one-time gift and migration regressions
        working-directory: apps/api
        run: |
          ./gradlew --no-daemon test \
            --tests ru.zhiv.game.ProgressionRewardsTest \
            --tests ru.zhiv.db.JdbcProgressionRewardsIntegrationTest \
            --tests ru.zhiv.db.JdbcOneTimeDailyRewardsMigrationIntegrationTest \
            --tests ru.zhiv.db.JdbcOnboardingRewardMigrationIntegrationTest \
            --tests ru.zhiv.db.JdbcSchemaBaselineIntegrationTest \
            --tests ru.zhiv.db.JdbcReleaseUpgradeIntegrationTest \
            --tests ru.zhiv.db.JdbcMigrationTimeoutIntegrationTest \
            --tests ru.zhiv.db.JdbcGameProgressResetIntegrationTest

      - name: Require every suite with real PostgreSQL
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('ru.zhiv.game.ProgressionRewardsTest', 'ru.zhiv.db.JdbcProgressionRewardsIntegrationTest', 'ru.zhiv.db.JdbcOneTimeDailyRewardsMigrationIntegrationTest', 'ru.zhiv.db.JdbcOnboardingRewardMigrationIntegrationTest', 'ru.zhiv.db.JdbcSchemaBaselineIntegrationTest', 'ru.zhiv.db.JdbcReleaseUpgradeIntegrationTest', 'ru.zhiv.db.JdbcMigrationTimeoutIntegrationTest', 'ru.zhiv.db.JdbcGameProgressResetIntegrationTest'):
              report = ET.parse(Path('apps/api/build/test-results/test') / f'TEST-{name}.xml').getroot()
              count = int(report.get('tests', '0'))
              assert report.get('name') == name and count > 0, f'{name}: missing or empty suite'
              assert all(int(report.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), f'{name}: failed or PostgreSQL skipped'
              cases = report.findall('testcase')
              assert len(cases) == count, f'{name}: incomplete cases'
              assert not any(child.tag in ('failure', 'error', 'skipped') for case in cases for child in case), f'{name}: failed or skipped case'
              print(f'{name}: {count} passed, 0 skipped, 0 failures, 0 errors.')
          PY

      - name: Upload one-time gift test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-rewards-test-reports-${{ github.run_attempt }}
          path: |
            apps/api/build/test-results/test/TEST-ru.zhiv.game.ProgressionRewardsTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcProgressionRewardsIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcOneTimeDailyRewardsMigrationIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcOnboardingRewardMigrationIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcSchemaBaselineIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcReleaseUpgradeIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcMigrationTimeoutIntegrationTest.xml
            apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcGameProgressResetIntegrationTest.xml
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Ktor and PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend tests
        working-directory: apps/api
        run: ./gradlew --no-daemon clean test

      - name: Require the PostgreSQL integration suite
        shell: bash
        run: |
          report="apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcZhivRepositoryIntegrationTest.xml"
          test -s "${report}"
          if grep --quiet '<skipped' "${report}"; then
            echo "PostgreSQL integration tests were skipped; Docker is required in CI." >&2
            exit 1
          fi
          auth_report="apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcAuthRepositoryIntegrationTest.xml"
          test -s "${auth_report}"
          if grep --quiet '<skipped' "${auth_report}"; then
            echo "Authentication integration tests must run with PostgreSQL." >&2
            exit 1
          fi
          for suite in JdbcAccountLifecycleIntegrationTest JdbcMergedIdentityMigrationIntegrationTest JdbcMergedHistoryIntegrationTest JdbcDirectInviteRepositoryIntegrationTest JdbcTimeZoneIntegrationTest JdbcGameRepositoryIntegrationTest JdbcWorldRepositoryIntegrationTest JdbcEconomyRepositoryIntegrationTest JdbcEconomyMarketRepositoryIntegrationTest JdbcMarketSaleClaimsIntegrationTest JdbcForestMemoryRepositoryIntegrationTest JdbcAdminRepositoryIntegrationTest JdbcModerationMigrationIntegrationTest JdbcTapHistoryIntegrationTest JdbcTapHistoryMigrationIntegrationTest JdbcFeedbackRepositoryIntegrationTest JdbcCurrencyDenominationIntegrationTest JdbcPearlDenominationIntegrationTest JdbcEconomyBarterRepositoryIntegrationTest JdbcProgressionRewardsIntegrationTest JdbcGuestProfileRepositoryIntegrationTest JdbcGuestWorldRepositoryIntegrationTest JdbcReleaseUpgradeIntegrationTest JdbcOnboardingEconomyIntegrationTest JdbcPresenceRepositoryIntegrationTest JdbcNotificationRepositoryIntegrationTest JdbcNotificationMigrationIntegrationTest JdbcPromoRepositoryIntegrationTest JdbcAdminEconomyGrantsIntegrationTest JdbcAdminPromoRepositoryIntegrationTest JdbcAdminMigrationCompatibilityIntegrationTest JdbcSchemaBaselineIntegrationTest JdbcGameProgressResetIntegrationTest; do
            lifecycle_report="apps/api/build/test-results/test/TEST-ru.zhiv.db.${suite}.xml"
            test -s "${lifecycle_report}"
            if grep --quiet '<skipped' "${lifecycle_report}"; then
              echo "Account lifecycle and history tests must run with PostgreSQL." >&2
              exit 1
            fi
          done
          security_report="apps/api/build/test-results/test/TEST-ru.zhiv.db.JdbcSecurityObservationsIntegrationTest.xml"
          test -s "${security_report}"
          grep --quiet --extended-regexp 'tests="[1-9][0-9]*"' "${security_report}"
          if grep --quiet '<skipped' "${security_report}"; then
            echo "Security observations must run with real PostgreSQL." >&2
            exit 1
          fi
          for suite in JdbcMailRepositoryIntegrationTest JdbcAdminEconomyGrantsIntegrationTest JdbcFirstHarvestIntegrationTest JdbcEarthLocationIntegrationTest; do
            mail_report="apps/api/build/test-results/test/TEST-ru.zhiv.db.${suite}.xml"
            test -s "${mail_report}"
            grep --quiet --extended-regexp 'tests="[1-9][0-9]*"' "${mail_report}"
            if grep --quiet '<skipped' "${mail_report}"; then
              echo "Mail, signed economy adjustments and first harvest must run with real PostgreSQL: ${suite}." >&2
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(path).getroot() for path in Path('apps/api/build/test-results/test').glob('TEST-*.xml')]
          totals = {key: sum(int(report.get(key, '0')) for report in reports) for key in ('tests', 'failures', 'errors', 'skipped')}
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          print(f"Backend verification: {passed} passed, {totals['skipped']} skipped, {totals['failures']} failures, {totals['errors']} errors.")
          security = next(report for report in reports if report.get('name') == 'ru.zhiv.db.JdbcSecurityObservationsIntegrationTest')
          print(f"Security observations PostgreSQL: {security.get('tests')} tests, {security.get('skipped', '0')} skipped.")
          for name in ('JdbcMailRepositoryIntegrationTest', 'JdbcAdminEconomyGrantsIntegrationTest'):
              report = next(report for report in reports if report.get('name') == f'ru.zhiv.db.{name}')
              print(f"{name} PostgreSQL: {report.get('tests')} tests, {report.get('skipped', '0')} skipped.")
          PY

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            apps/api/build/test-results/test/
            apps/api/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: warn

  compose:
    name: Production Compose smoke test
    needs: [secrets, web, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: zhiv-ci-${{ github.run_id }}
      DOMAIN: localhost
      COMPOSE_PROFILES: monitoring
      ADMIN_PUBLIC_IDS: 0000-0000-0571,0000-0000-0572
      MONITORING_URL: http://prometheus:9090
      METRICS_TOKEN_FILE: /run/monitoring-secrets/token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create isolated test credentials
        run: node scripts/create-deploy-secrets.mjs

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Validate monitoring configuration and alert rules
        run: |
          docker compose -f deploy/compose.yml run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose -f deploy/compose.yml run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alerts.yml

      - name: Validate optional alert delivery without sending notifications
        run: |
          mkdir -p deploy/.secrets/alerts
          chmod 755 deploy/.secrets/alerts
          printf '%s\n' 'https://alerts.example.invalid/ci-only' > deploy/.secrets/alerts/webhook_url
          chmod 444 deploy/.secrets/alerts/webhook_url
          python3 scripts/check-alert-delivery.py
          docker compose -f deploy/compose.yml -f deploy/monitoring/alerting.compose.yml config --format json | python3 scripts/check-deploy-perimeter.py
          docker compose -f deploy/compose.yml -f deploy/monitoring/alerting.compose.yml run --rm --no-deps --entrypoint /bin/amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
          docker compose -f deploy/compose.yml -f deploy/monitoring/alerting.compose.yml run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose -f deploy/compose.yml -f deploy/monitoring/alerting.compose.yml run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alert-delivery.yml

      - name: Reproduce a checkout with restrictive file permissions
        run: chmod --recursive go-rwx public

      - name: Build and start the production stack
        run: docker compose -f deploy/compose.yml up --build --detach --wait --wait-timeout 240

      - name: Verify HTTPS routes
        run: |
          curl --fail --silent --show-error --insecure https://localhost/healthz
          curl --fail --silent --show-error --insecure https://localhost/readyz
          curl --fail --silent --show-error --insecure https://localhost/ >/dev/null
          curl --fail --silent --show-error --insecure https://localhost/achievements/seven_day_streak.svg >/dev/null
          curl --fail --silent --show-error --insecure https://localhost/achievements/thousand_taps.svg >/dev/null
          curl --fail --silent --show-error --insecure https://localhost/achievements/five_friends.svg >/dev/null

      - name: Verify production development tools are closed
        shell: bash
        run: |
          test "$(curl --silent --show-error --insecure --output /dev/null --write-out '%{http_code}' https://localhost/prototype/tiled-world)" = 404
          docker compose -f deploy/compose.yml exec -T web node -e '
            fetch("http://127.0.0.1:3000/api/v1/me").then(async response => {
              if (response.status !== 503 || (await response.json()).code !== "DEV_API_DISABLED")
                throw new Error("Production web must not serve its development API");
            }).catch(error => { console.error(error.message); process.exit(1); });'
          docker compose -f deploy/compose.yml exec -T web node -e '
            (async () => {
              for (const method of ["GET", "POST"]) {
                const response = await fetch("http://127.0.0.1:3000/api/dev/world-studio", {
                  method, headers: { Origin: "http://127.0.0.1:3000", "Content-Type": "application/json" },
                  ...(method === "POST" ? { body: "{}" } : {}),
                });
                const data = await response.json();
                if (response.status !== 404 || data.available !== false || response.headers.get("cache-control") !== "no-store")
                  throw new Error("Production web must not expose studio project files");
              }
            })().catch(error => { console.error(error.message); process.exit(1); });'

      - name: Verify the public weather route through the production edge
        shell: bash
        run: |
          weather_response="$(mktemp)"
          trap 'rm -f "$weather_response"' EXIT
          weather_status="$(curl --silent --show-error --insecure --max-time 10 --output "$weather_response" --write-out '%{http_code}' 'https://localhost/api/v1/earth/weather?lat=55.75&lng=38')"
          test "$weather_status" = 400
          node --input-type=module - "$weather_response" <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.error !== 'invalid_coordinates') throw new Error('Public weather did not reach its bounded web handler');
          NODE

      - name: Exercise the isolated production API
        run: node scripts/smoke-production.mjs

      - name: Verify deployment status and maintenance gate
        shell: bash
        run: |
          status_file="$(mktemp)"
          curl --fail --silent --show-error --insecure https://localhost/app-status.json > "$status_file"
          node --input-type=module - "$status_file" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (status.schemaVersion !== 1 || status.maintenance !== false || !status.buildId) throw new Error('Invalid built app status');
          fs.writeFileSync('deploy/runtime/app-status.json', JSON.stringify({...status, maintenance: true}));
          NODE
          trap 'rm -f deploy/runtime/maintenance deploy/runtime/app-status.json "$status_file"' EXIT
          touch deploy/runtime/maintenance
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://localhost/)" = 503
          test "$(curl --silent --insecure --request POST --output /dev/null --write-out '%{http_code}' https://localhost/api/v1/check-ins)" = 503
          curl --fail --silent --show-error --insecure https://localhost/app-status.json > "$status_file"
          node --input-type=module - "$status_file" <<'NODE'
          import fs from 'node:fs';
          if (JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).maintenance !== true) throw new Error('Maintenance status was intercepted by the gate');
          NODE

      - name: Exercise private administration and real monitoring
        run: node scripts/smoke-admin.mjs

      - name: Rehearse the real deployment with a restored backup and existing players
        shell: bash
        run: |
          test "$DOMAIN" = localhost
          [[ "$COMPOSE_PROJECT_NAME" =~ ^zhiv-ci-[0-9]+$ ]]
          test ! -e deploy/.env
          # deploy-update uses sudo docker, which strips inherited CI variables.
          # Pin only this disposable project in a temporary deployment env file.
          trap 'rm -f deploy/.env' EXIT
          for variable in COMPOSE_PROJECT_NAME COMPOSE_PROFILES DOMAIN ADMIN_PUBLIC_IDS MONITORING_URL METRICS_TOKEN_FILE; do
            printf '%s=%s\n' "$variable" "${!variable}"
          done > deploy/.env
          chmod 600 deploy/.env
          persistent_snapshot() {
            docker compose -f deploy/compose.yml exec -T db psql -X -A -t -U zhiv -d zhiv -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(jsonb_build_object(
            'users', (SELECT jsonb_agg(to_jsonb(u) ORDER BY id) FROM app_users u),
            'economy', (SELECT jsonb_agg(to_jsonb(e) ORDER BY user_id) FROM economy_profiles e),
            'checkins', (SELECT jsonb_agg(to_jsonb(c) ORDER BY id) FROM check_ins c)
          )::text);
          SQL
          }
          before_deployment="$(persistent_snapshot)"
          bash scripts/deploy-update.sh
          test "$(persistent_snapshot)" = "$before_deployment"
          test ! -e deploy/runtime/maintenance
          curl --fail --silent --show-error --insecure --max-time 20 https://localhost/readyz
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync('deploy/runtime/app-status.json', 'utf8'));
          if (status.schemaVersion !== 1 || status.maintenance !== false || !status.buildId)
            throw new Error('The real deployment did not reopen a ready build');
          NODE

      - name: Verify explicit user reset with a restored backup
        shell: bash
        run: |
          if bash scripts/reset-user-data.sh; then
            echo "Reset must require an explicit destructive flag."
            exit 1
          fi
          if bash scripts/reset-user-data.sh --confirm-delete-all-users; then
            echo "Reset must refuse an API with legacy signup enabled."
            exit 1
          fi
          docker compose -f deploy/compose.yml exec -T db psql -X -U zhiv -d zhiv -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO account_login_flows (token_hash, browser_hash, provider, intent)
          VALUES (decode(repeat('01', 32), 'hex'), decode(repeat('02', 32), 'hex'), 'vk', 'login');
          INSERT INTO account_registration_tickets (token_hash, browser_hash, provider, subject)
          VALUES (decode(repeat('03', 32), 'hex'), decode(repeat('04', 32), 'hex'), 'email', 'reset@example.com');
          INSERT INTO player_feedback (id, user_id, client_request_id, category, message)
          SELECT '00000000-0000-4000-8000-000000000071', id, '00000000-0000-4000-8000-000000000072',
                 'bug', 'CI feedback before user reset' FROM app_users ORDER BY id LIMIT 1;
          INSERT INTO player_feedback_actions (request_id, feedback_id, actor_user_id, status)
          SELECT '00000000-0000-4000-8000-000000000073', id, user_id, 'reviewed'
          FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071';
          INSERT INTO app_sessions (id, user_id, token_hash, expires_at)
          SELECT '00000000-0000-4000-8000-000000000074', user_id, decode(repeat('05', 32), 'hex'),
                 clock_timestamp() + interval '1 day'
          FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071';
          INSERT INTO notification_preferences (user_id, preferences)
          SELECT user_id, '{}'::jsonb FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071'
          ON CONFLICT (user_id) DO UPDATE SET preferences = EXCLUDED.preferences;
          INSERT INTO notification_subscriptions (endpoint_hash, user_id, session_id, endpoint, p256dh, auth)
          SELECT decode(repeat('06', 32), 'hex'), user_id, id, 'https://example.invalid/ci-reset', 'ci-key', 'ci-auth'
          FROM app_sessions WHERE id = '00000000-0000-4000-8000-000000000074';
          INSERT INTO notification_events (user_id, source_key, category, due_at, next_attempt_at)
          SELECT user_id, 'ci-reset-event', 'checkin', clock_timestamp() + interval '1 hour', clock_timestamp() + interval '1 hour'
          FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071';
          INSERT INTO notification_batches (id, user_id, reserved_at, state)
          SELECT '00000000-0000-4000-8000-000000000075', user_id, clock_timestamp(), 'delivered'
          FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071';
          INSERT INTO promo_redemptions (user_id, origin_user_id, promo_id, request_id, title, reward, accepted_revision)
          SELECT user_id, user_id, 'ci-reset-promo', '00000000-0000-4000-8000-000000000076', 'CI reset gift', '{}'::jsonb, 1
          FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071';
          CREATE TABLE public.ci_reset_unreviewed_guard (value text);
          SQL
          if docker compose -f deploy/compose.yml exec -T db psql -X -U zhiv -d zhiv -v ON_ERROR_STOP=1 < scripts/reset-user-data.sql; then
            echo "Reset must refuse an unexpected table before clearing any data."
            exit 1
          fi
          docker compose -f deploy/compose.yml exec -T db psql -X -U zhiv -d zhiv -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071') <> 1
                OR (SELECT count(*) FROM player_feedback_actions WHERE request_id = '00000000-0000-4000-8000-000000000073') <> 1
                OR (SELECT count(*) FROM notification_preferences WHERE user_id = (SELECT user_id FROM player_feedback WHERE id = '00000000-0000-4000-8000-000000000071')) <> 1
                OR (SELECT count(*) FROM notification_subscriptions WHERE endpoint_hash = decode(repeat('06', 32), 'hex')) <> 1
                OR (SELECT count(*) FROM notification_events WHERE source_key = 'ci-reset-event') <> 1
                OR (SELECT count(*) FROM notification_batches WHERE id = '00000000-0000-4000-8000-000000000075') <> 1
                OR (SELECT count(*) FROM promo_redemptions WHERE promo_id = 'ci-reset-promo') <> 1 THEN
              RAISE EXCEPTION 'Refused reset changed seeded feedback, notifications or promo history.';
            END IF;
          END $$;
          DROP TABLE public.ci_reset_unreviewed_guard;
          SQL
          preserved_snapshot() {
            docker compose -f deploy/compose.yml exec -T db psql -X -A -t -U zhiv -d zhiv -v ON_ERROR_STOP=1 <<'SQL'
          SELECT jsonb_build_object(
            'migrations', (SELECT jsonb_agg(to_jsonb(h) ORDER BY installed_rank) FROM flyway_schema_history h),
            'coverage', (SELECT jsonb_agg(to_jsonb(m) ORDER BY singleton) FROM game_tap_collection_metadata m)
          )::text;
          SQL
          }
          preserved_before="$(preserved_snapshot)"
          export VK_CLIENT_ID=123
          docker compose -f deploy/compose.yml up -d --no-deps --no-build --wait api
          bash scripts/reset-user-data.sh --confirm-delete-all-users
          test "$(preserved_snapshot)" = "$preserved_before"
          docker compose -f deploy/compose.yml exec -T db psql -X -U zhiv -d zhiv -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM app_users) OR EXISTS (SELECT 1 FROM player_feedback)
                OR EXISTS (SELECT 1 FROM player_feedback_actions)
                OR EXISTS (SELECT 1 FROM forest_memory) OR EXISTS (SELECT 1 FROM forest_memory_receipts)
                OR EXISTS (SELECT 1 FROM notification_preferences) OR EXISTS (SELECT 1 FROM notification_subscriptions)
                OR EXISTS (SELECT 1 FROM notification_events) OR EXISTS (SELECT 1 FROM notification_batches)
                OR EXISTS (SELECT 1 FROM promo_redemptions) THEN
              RAISE EXCEPTION 'User, feedback, forest memory, notification or promo data survived the confirmed reset.';
            END IF;
          END $$;
          SQL
          curl --fail --silent --show-error --insecure https://localhost/readyz
          status="$(curl --silent --show-error --insecure -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://localhost/api/v1/bootstrap)"
          test "$status" = 410

      - name: Verify a fresh database reset with typed confirmation
        shell: bash
        env:
          VK_CLIENT_ID: "123"
        run: |
          python3 scripts/verify-reset-database-ci.py
          curl --fail --silent --show-error --insecure https://localhost/healthz
          curl --fail --silent --show-error --insecure https://localhost/readyz
          curl --fail --silent --show-error --insecure https://localhost/ >/dev/null
          status="$(curl --silent --show-error --insecure -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://localhost/api/v1/bootstrap)"
          test "$status" = 410

      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose -f deploy/compose.yml ps
          docker compose -f deploy/compose.yml logs --no-color

      - name: Stop the isolated CI stack
        if: always()
        run: docker compose -f deploy/compose.yml down --volumes --remove-orphans
