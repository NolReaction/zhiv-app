name: Native mobile prototype

on:
  push:
    branches: [experiment/native-mobile]
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'features/earth/native-location.ts'
      - 'features/earth/location.ts'
      - 'tests/earth-native-location.test.mjs'
      - 'tests/mobile-*.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mobile
      - run: npm run mobile:build
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew --no-daemon assembleDebug lintDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: mochlik-native-lab-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci --no-audit --no-fund
      - run: npm run mobile:build
      - run: npx cap sync ios
        working-directory: apps/mobile
      - name: Compile without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile
