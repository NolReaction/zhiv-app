global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          follow_redirects: false

inhibit_rules:
  - source_matchers: ['alertname="ZhivApiDown"']
    target_matchers: ['alertname=~"ZhivHighErrorRate|ZhivSlowApi|ZhivRateLimited|ZhivGameRejects"']
