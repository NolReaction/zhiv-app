global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    sample_limit: 10000
    static_configs:
      - targets: ['api:8080']
  - job_name: node
    sample_limit: 5000
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: prometheus
    sample_limit: 5000
    static_configs:
      - targets: ['localhost:9090']
