groups:
  - name: zhiv-alert-delivery
    rules:
      - alert: ZhivAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Alert delivery is unavailable; use an independent external uptime monitor.
      - alert: ZhivAlertDeliveryFailing
        expr: sum(increase(alertmanager_notifications_failed_total{job="alertmanager"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The external notification receiver has rejected or timed out alert delivery.
      - alert: ZhivPrometheusAlertDeliveryFailing
        expr: sum(increase(prometheus_notifications_errors_total{job="prometheus"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Prometheus could not forward one or more notifications to Alertmanager.
