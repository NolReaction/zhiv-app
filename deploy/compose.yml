name: zhiv

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: zhiv
      POSTGRES_USER: zhiv
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
    secrets: [db_admin]
    networks: [backend]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiv -d zhiv"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

  provision:
    image: postgres:18-alpine
    restart: "no"
    entrypoint: ["sh", "/provision-roles.sh"]
    volumes:
      - ./provision-roles.sh:/provision-roles.sh:ro
    secrets: [db_admin, db_migration, db_app]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  migrate:
    build:
      context: ../apps/api
    restart: "no"
    command: ["ru.zhiv.db.MigrationMainKt"]
    environment:
      APP_ENV: production
      DATABASE_URL: jdbc:postgresql://db:5432/zhiv
      DATABASE_USER: zhiv_migrator
      DATABASE_PASSWORD_FILE: /run/secrets/db_migration
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
    secrets: [db_migration]
    networks: [backend]
    depends_on:
      provision:
        condition: service_completed_successfully
    logging: *default-logging

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: jdbc:postgresql://db:5432/zhiv
      DATABASE_USER: zhiv_app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
    secrets: [db_app]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    init: true
    networks: [backend]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    networks: [backend, edge]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:

secrets:
  db_admin:
    file: ${DB_ADMIN_PASSWORD_FILE:-./.secrets/db_admin}
  db_migration:
    file: ${DB_MIGRATION_PASSWORD_FILE:-./.secrets/db_migration}
  db_app:
    file: ${DB_APP_PASSWORD_FILE:-./.secrets/db_app}
