<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efdf">
  <title>Дом Мохлика · Атлас построек</title>
  <style>
    :root { color-scheme: light; --paper: #f4efdf; --ink: #253b2f; --quiet: #5d6756; --edge: #cbc8b4; --green: #304a38; --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font: 500 16px/1.35 "Avenir Next", "Segoe UI", Arial, sans-serif; background: var(--paper); color: var(--ink); }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1400px; padding: 0 clamp(14px,4.6vw,68px) 32px; margin: auto; }
    [hidden] { display: none !important; }
    button, a { font: inherit; color: inherit; touch-action: manipulation; }
    button { cursor: pointer; }
    a { text-decoration: none; }
    :is(a,button,canvas):focus-visible { outline: 3px solid #d78c36; outline-offset: 3px; }
    .icon { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; min-height: 64px; border-bottom: 1px solid var(--edge); }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .mark { width: 32px; height: 32px; color: #795536; }
    .brand strong { font: 700 27px/.95 var(--serif); letter-spacing: -.07em; }
    .series { border-left: 1px solid var(--edge); padding-left: 13px; margin-left: 3px; color: var(--quiet); font-size: 13px; }
    .from, .source { display: inline-flex; align-items: center; gap: 7px; padding: 9px 0; font-size: 14px; }
    .from:hover, .source:hover { text-decoration: underline; text-underline-offset: 4px; }
    .headline, .after { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .headline { margin: clamp(15px,2.1vw,28px) 0 17px; }
    h1 { margin: 0; font: 500 clamp(36px,5.3vw,67px)/1.05 var(--serif); letter-spacing: -.055em; }
    #modes { display: inline-flex; flex: none; border: 1px solid #b9bead; border-radius: 9px; padding: 3px; gap: 3px; background: #ede8d7; }
    #modes button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 35px; border: 0; padding: 6px 12px; font-size: 13px; border-radius: 6px; background: transparent; }
    #modes button[aria-pressed="true"] { color: #fff4dc; background: var(--green); }
    .stage { isolation: isolate; position: relative; overflow: hidden; border: 1px solid #aeb4a0; border-radius: 13px; width: 100%; height: clamp(290px,52svh,610px); background: radial-gradient(ellipse at 50% 46%,#fcf7e7 0%,#ece8d4 75%,#dadccc 100%); }
    #art, #world { position: absolute; width: 100%; height: 100%; inset: 0; }
    #art { display: grid; place-items: center; }
    #sprite { display: block; width: 96%; height: 100%; object-fit: contain; }
    #world { display: block; touch-action: none; cursor: grab; }
    #world:active { cursor: grabbing; }
    .stage[data-view="art"] #world, .stage[data-view="art"] #map-tools { visibility: hidden; pointer-events: none; }
    .stage[data-ready="true"][data-view="map"] #art { display: none; }
    .stage[data-ready="false"] #world { opacity: 0; }
    #circle { position: absolute; width: 1px; height: 1px; pointer-events: none; opacity: 0; }
    #map-tools, #map-status { position: absolute; z-index: 2; color: #fbf3dd; background: #21372eea; border: 1px solid #f3e8be72; border-radius: 8px; }
    #map-tools { display: flex; right: 12px; bottom: 12px; padding: 2px; gap: 2px; max-width: calc(100% - 20px); }
    #map-tools button { color: inherit; background: none; display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 7px 9px; min-width: 38px; min-height: 38px; border: 0; border-radius: 5px; font-size: 13px; }
    #map-tools button:is(:hover,:focus-visible), #map-tools button[aria-pressed="true"] { background: #53664a; }
    #map-status { left: 12px; bottom: 12px; padding: 7px 10px; font-size: 13px; }
    #map-status button { border: 0; background: none; color: inherit; text-decoration: underline; }
    .after { margin: 12px 0 10px; }
    .after h2 { line-height: 1.2; font-size: 14px; font-weight: 600; margin: 0; }
    .levels { margin: 0; display: grid; gap: 8px; grid-template-columns: repeat(5,minmax(0,1fr)); }
    .levels button { position: relative; border: 1px solid var(--edge); background: #eee9d7; color: #354436; display: flex; align-items: center; gap: 11px; justify-content: flex-start; border-radius: 8px; min-height: 62px; padding: 8px 12px; text-align: left; }
    .levels button:hover { background: #e3e5d0; border-color: #a8af97; }
    .levels button[aria-pressed="true"] { color: #faf3dd; border-color: var(--green); background: var(--green); }
    .levels b { font: 500 clamp(20px,2.6vw,32px)/1 var(--serif); text-align:center; min-width: 34px; }
    .levels span { font-size: 13px; line-height: 1.2; }
    .current { display: none; margin: 0; font-size: 14px; }
    @media(max-width:800px) {
      .levels button { flex-direction: column; align-items: flex-start; gap: 6px; padding: 9px 11px; }
      .levels b { min-width: auto; }
      .stage { height: clamp(290px,55svh,540px); }
    }
    @media(max-width:550px) {
      main { padding-bottom: 12px; } header { min-height: 47px; } .mark { width: 25px; height: 25px; } .brand { gap: 5px; } .brand strong { font-size: 22px; } .series { font-size: 11px; padding-left: 9px; margin-left: 5px; }
      .from, .source { font-size: 12px; } .from .icon, .source .icon { width: 14px; height: 14px; }
      .headline { flex-wrap: wrap; gap: 9px; margin: 13px 0 10px; } h1 { font-size: clamp(32px,8vw,44px); }
      #modes button { padding: 5px 8px; font-size: 12px; min-height: 31px; } #modes .icon { width: 15px; height: 15px; }
      .stage { height: clamp(275px,54svh,490px); border-radius: 9px; }
      .after { margin: 8px 0 6px; } .after h2 {display: none} .current {display:block}
      .levels { gap: 5px; } .levels button { min-height: 43px; padding: 6px; align-items:center; justify-content: center; } .levels b { font-size: 21px; } .levels span { display:none; }
      #map-tools { right: 7px; bottom: 7px; } #map-tools button { min-width: 32px; min-height: 32px; padding: 5px; } #map-status { bottom: auto; top: 8px; left: 8px; }
    }
    @media(max-height:470px) and (min-width:551px) { header { min-height: 36px; } .headline { margin: 6px 0; } h1 { font-size: 29px; } .stage { height: 63svh; min-height: 170px; } .after { margin: 4px 0; } .levels button { min-height: 41px; flex-direction: row; align-items:center; } }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
  <symbol id="seal" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5c1-5 7-9 13-8.4 2.8-3 6.6-3.7 9.4-2.9-.2 4.5-2.8 7.9-7.3 8.7 2.6 4.7 1.1 10.1-3.1 12.6-5.1 3.2-11.2.2-12.3-4.5-.5-2-.3-3.6.3-5.5Z"/><path d="M9 16.6c2.2-3.6 7-4.7 9.1-1.4 2.8 4.2-.7 8.7-4.6 7.9-3.9-.8-4.1-5.6-1-6.6 2.4-.8 3.8 1.5 2.3 3M20 11.5l4-4"/></g></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M4 15v5h16v-5"/></symbol><symbol id="wood" viewBox="0 0 24 24"><path d="m3 8 5.5-4.5 7 4.5 5.5-3v13l-5.5 2.5-7-4.5L3 20zm5.5-4.5V16m7-8v12.5"/></symbol><symbol id="ink" viewBox="0 0 24 24"><path d="m4 19 .8-4.6L15.6 3.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L9.6 19.2 5 20Zm9.7-13.4 4.7 4.7M5 14l4.7 4.7"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5m0-14.2-1.5 1.5M6.4 17.6l-1.5 1.5"/></symbol><symbol id="moon" viewBox="0 0 24 24"><path d="M20.2 15.2A8 8 0 0 1 8.8 3.8a9 9 0 1 0 11.4 11.4Z"/></symbol><symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></symbol><symbol id="focus" viewBox="0 0 24 24"><path d="M9 4H4v5m0 6v5h5m6 0h5v-5m0-6V4h-5"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>
<main>
  <header>
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#seal"/></svg><strong>Жив</strong><span class="series">Атлас построек</span></div>
    <a class="from" id="back" href="../workshop-vector/index.html"><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg>К мастерской</a>
  </header>
  <div class="headline">
    <h1>Дом Мохлика</h1>
    <div id="modes" role="group" aria-label="Вид дома" hidden>
      <button type="button" data-view="map"><svg class="icon" aria-hidden="true"><use href="#wood"/></svg>Поляна</button>
      <button type="button" data-view="art"><svg class="icon" aria-hidden="true"><use href="#ink"/></svg>Рисунок</button>
    </div>
  </div>
  <section class="stage" id="stage" aria-label="Просмотр дома" data-ready="false" data-view="art">
    <div id="art"><img id="sprite" src="home-1.svg" width="480" height="400" alt="Дом Мохлика первого уровня" draggable="false"></div>
    <canvas id="world" tabindex="0" hidden aria-label="Дом на игровой карте. Стрелки перемещают карту, плюс и минус меняют масштаб."></canvas>
    <canvas id="circle" aria-hidden="true" hidden></canvas>
    <div id="map-status" role="status" hidden><span></span><button id="retry" type="button" hidden>Повторить</button></div>
    <div id="map-tools" hidden role="group" aria-label="Управление картой">
      <button type="button" id="lighting" title="Переключить день и ночь"><svg class="icon" aria-hidden="true"><use href="#sun"/></svg><span>День</span></button>
      <button type="button" id="minus-zoom" aria-label="Отдалить"><svg class="icon" aria-hidden="true"><use href="#minus"/></svg></button>
      <button type="button" id="plus-zoom" aria-label="Приблизить"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg></button>
      <button type="button" id="focus-house" aria-label="Показать дом крупно"><svg class="icon" aria-hidden="true"><use href="#focus"/></svg></button>
    </div>
  </section>
  <div class="after">
    <h2 id="level-heading">Уровни дома</h2>
    <span class="current" aria-live="polite" id="current"></span>
    <a class="source" id="download-link" href="home-1.svg" download="home-1.svg"><svg class="icon" aria-hidden="true"><use href="#download"/></svg>Скачать SVG</a>
  </div>
  <div class="levels" id="levels" role="group" aria-label="Выбрать уровень дома">
    <button type="button" data-level="1" aria-pressed="true"><b>I</b><span>Жилой пень</span></button>
    <button type="button" data-level="2" aria-pressed="false"><b>II</b><span>Резной портал</span></button>
    <button type="button" data-level="3" aria-pressed="false"><b>III</b><span>Крыльцо у корней</span></button>
    <button type="button" data-level="4" aria-pressed="false"><b>IV</b><span>Тёплый очаг</span></button>
    <button type="button" data-level="5" aria-pressed="false"><b>V</b><span>Лесная веранда</span></button>
  </div>
</main>
<script>
  const stage = document.getElementById('stage');
  const downloadLink = document.getElementById('download-link');
  const mapAvailable = Boolean(document.querySelector('meta[name="forest-scene"]'));
  const gameSprites = JSON.parse(document.getElementById('sprite').dataset.gameSprites || '{}');
  const query = new URLSearchParams(location.search);
  const requested = Number(query.get('level') ?? 1);
  let selection = Number.isInteger(requested) && requested >= 1 && requested <= 5 ? requested : 1;
  let mode = mapAvailable && query.get('view') !== 'art' ? 'map' : 'art';
  const buttons = [...document.querySelectorAll('#levels button')];
  const views = [...document.querySelectorAll('#modes button')];
  const $ = id => document.getElementById(id);
  function updateURL() {
    const url = new URL(location.href);
    if (selection === 1) url.searchParams.delete('level');
    else url.searchParams.set('level', String(selection));
    if (mode === 'art' && mapAvailable) url.searchParams.set('view', 'art');
    else url.searchParams.delete('view');
    if (location.protocol !== 'file:') history.replaceState(null, '', url);
  }
  function sync() {
    for (const button of buttons) {
      const active = Number(button.dataset.level) === selection;
      button.setAttribute('aria-pressed', String(active));
      const numeral = button.querySelector('b').textContent;
      const title = button.querySelector('span').textContent;
      button.setAttribute('aria-label', 'Уровень ' + numeral + ' · ' + title);
      if (active) {
        const filename = 'home-' + selection + '.svg';
        $('current').textContent = numeral + ' · ' + title;
        $('sprite').alt = 'Дом Мохлика ' + numeral + ' уровня. ' + title;
        const displayFile = mode === 'map' && gameSprites[selection] ? gameSprites[selection] : filename;
        if ($('sprite').getAttribute('src') !== displayFile) $('sprite').setAttribute('src', displayFile);
        downloadLink.href = filename;
        downloadLink.download = filename;
        downloadLink.setAttribute('aria-label','Скачать SVG дома ' + numeral + ' уровня');
      }
    }
    stage.dataset.view = mode;
    stage.dataset.level = String(selection);
    $('modes').hidden = !mapAvailable;
    $('map-tools').hidden = !mapAvailable;
    $('world').hidden = !mapAvailable;
    $('circle').hidden = !mapAvailable;
    if (mode === 'art') $('map-status').hidden = true;
    for (const view of views) view.setAttribute('aria-pressed', String(view.dataset.view === mode));
    stage.dispatchEvent(new Event('homeviewchange'));
  }
  for (const button of buttons) button.addEventListener('click',() => { selection = Number(button.dataset.level); sync(); updateURL(); });
  for (const view of views) view.addEventListener('click',() => { mode = view.dataset.view; sync(); updateURL(); });
  sync();
</script>
</body>
</html>
