# The full test compilation exceeds Gradle's default 512 MiB heap. Keep the
# compiler in the same bounded JVM for clean CI and Docker builds, rather than
# retaining a second Kotlin daemon beside Gradle and the test worker.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
